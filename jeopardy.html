<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angie &amp; Willy Jeopardy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #742d49;
      --wine-soft: rgba(116, 45, 73, 0.55);
      --wine-faint: rgba(116, 45, 73, 0.14);
      --white: #ffffff;
      --cream: #fffaf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      min-height: 100vh;
      color: var(--wine);
      padding: 2rem 1rem;
    }
    .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

    .bg-decor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .bg-decor .float-item {
      position: absolute;
      opacity: 0.22;
      animation: float-drift ease-in-out infinite;
    }
    .bg-decor .float-item.heart {
      color: #742d49;
    }
    @keyframes float-drift {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-42px) rotate(8deg); }
    }

    @keyframes fade-up {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop-in {
      0% { transform: rotateY(0deg) scale(0.6); opacity: 0; }
      50% { transform: rotateY(90deg) scale(1.05); opacity: 1; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    @keyframes category-in {
      0% { opacity: 0; transform: translateY(-16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(116, 45, 73, 0.4); }
      50% { box-shadow: 0 0 0 14px rgba(116, 45, 73, 0); }
    }
    @keyframes reveal-pop {
      0% { transform: scale(0.5) rotate(-4deg); opacity: 0; }
      60% { transform: scale(1.08) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes confetti-burst {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
    }
    @keyframes crown-bounce {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-3px) rotate(8deg); }
    }
    @keyframes gameover-bounce {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes sparkle-twinkle {
      0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
    }
    .gameover-sparkle {
      display: inline-block;
      animation: sparkle-twinkle 1.6s ease-in-out infinite;
    }
    .fade-in {
      animation: fade-up 0.5s ease;
    }
    .tile-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .tile-btn:hover:not(:disabled) {
      transform: translateY(-3px);
    }
    .tile-btn.used {
      animation: pop-in 0.45s ease;
    }
    .category-in {
      animation: category-in 0.45s ease both;
    }
    .reveal-btn-pulse {
      animation: pulse-glow 1.4s ease-in-out infinite;
    }
    .answer-reveal {
      animation: reveal-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gameover-bounce {
      animation: gameover-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .score-confetti span {
      position: absolute;
      top: 0;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 2px;
      animation: confetti-burst 0.7s ease-out forwards;
    }
    .pill-btn {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .pill-btn:hover {
      transform: translateY(-2px);
      opacity: 0.88;
    }
    .pill-btn:active {
      transform: translateY(0);
    }
    .doodle-underline {
      display: block;
      margin: 0 auto 1.5rem;
    }

    /* ---- Hidden Game intro ---- */
    @keyframes hidden-rays-spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes hidden-flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes hidden-ring-pulse {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.75; }
      100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }
    @keyframes hidden-letter-in {
      0% { transform: translateY(-120%) rotate(-25deg) scale(2.2); opacity: 0; filter: blur(6px); }
      65% { transform: translateY(10%) rotate(4deg) scale(0.92); opacity: 1; filter: blur(0); }
      100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; filter: blur(0); }
    }
    @keyframes hidden-shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(3px, 3px); }
    }
    @keyframes hidden-shimmer {
      0% { transform: translateX(-140%) skewX(-18deg); }
      100% { transform: translateX(340%) skewX(-18deg); }
    }
    @keyframes hidden-fade-up {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes hidden-sparkle {
      0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(90deg); opacity: 1; }
    }
    @keyframes hidden-exit {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.25); }
    }
    .hidden-intro-exit {
      animation: hidden-exit 0.6s ease-in forwards;
    }
    .hidden-rays {
      animation: hidden-rays-spin 14s linear infinite;
    }
    .hidden-flash {
      animation: hidden-flash 0.55s ease-out forwards;
    }
    .hidden-ring {
      animation: hidden-ring-pulse 2.2s ease-out infinite backwards;
    }
    .hidden-title {
      animation: hidden-shake 0.5s ease-in-out 1.05s both;
    }
    .hidden-letter {
      display: inline-block;
      animation: hidden-letter-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .hidden-shimmer {
      animation: hidden-shimmer 1.6s ease-in-out 1.2s infinite backwards;
    }
    .hidden-fade-up {
      animation: hidden-fade-up 0.6s ease both;
    }
    .hidden-sparkle {
      animation: hidden-sparkle 1.8s ease-in-out infinite backwards;
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="float-item" style="top:6%; left:6%; font-size:2.6rem; animation-duration:9s;">🥂</span>
    <span class="float-item heart" style="top:12%; left:88%; font-size:2rem; animation-duration:7s; animation-delay:0.5s;">♥</span>
    <span class="float-item" style="top:28%; left:92%; font-size:2.2rem; animation-duration:10s; animation-delay:1.2s;">🥂</span>
    <span class="float-item heart" style="top:40%; left:3%; font-size:1.8rem; animation-duration:8s; animation-delay:2s;">♥</span>
    <span class="float-item" style="top:62%; left:90%; font-size:2rem; animation-duration:8.5s; animation-delay:0.8s;">🥂</span>
    <span class="float-item heart" style="top:70%; left:8%; font-size:2.4rem; animation-duration:9.5s; animation-delay:1.6s;">♥</span>
    <span class="float-item" style="top:85%; left:80%; font-size:1.9rem; animation-duration:7.5s; animation-delay:2.5s;">🥂</span>
    <span class="float-item heart" style="top:90%; left:20%; font-size:2rem; animation-duration:9s; animation-delay:0.3s;">♥</span>
    <span class="float-item heart" style="top:4%; left:45%; font-size:1.7rem; animation-duration:10.5s; animation-delay:1s;">♥</span>
    <span class="float-item" style="top:50%; left:50%; font-size:1.8rem; animation-duration:11s; animation-delay:2.2s;">🥂</span>
    <span class="float-item heart" style="top:18%; left:35%; font-size:1.9rem; animation-duration:9.2s; animation-delay:1.1s;">♥</span>
    <span class="float-item" style="top:35%; left:60%; font-size:2rem; animation-duration:10.2s; animation-delay:0.4s;">🥂</span>
    <span class="float-item heart" style="top:58%; left:40%; font-size:1.7rem; animation-duration:8.8s; animation-delay:1.8s;">♥</span>
    <span class="float-item" style="top:80%; left:14%; font-size:2.1rem; animation-duration:9.8s; animation-delay:0.9s;">🥂</span>
    <span class="float-item heart" style="top:94%; left:75%; font-size:1.8rem; animation-duration:8.2s; animation-delay:2.4s;">♥</span>
  </div>
  <div class="container">
    <div id="root"></div>
  </div>
  <audio id="final-jeopardy-theme" src="/wilsonwang/jeopardy-theme.mp3" preload="auto"></audio>
  <audio id="hidden-game-fanfare" src="/wilsonwang/koiroylers-tada-fanfare-356032.mp3" preload="auto"></audio>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BOARD = [
      {
        name: 'All About Angela',
        clues: [
          { value: 100, question: 'If this ingredient shows up in Angela’s food, she’s picking it out.', answer: 'Onion' },
          // { value: 200, question: 'This is the type of restaurant Angela’s family runs.', answer: 'Hong Kong Style Cafe' },
          {
            value: 200,
            question: 'Put A Ring On It!',
            hidden: true,
            instructions: 'Send two people up for a relay. Each teammate gets 45 seconds to hook peach rings using only a stick in their mouth and carry them to the other side of the room. The team with the most peach rings wins!',
          },
          { value: 300, question: 'This is the TV show Angela has watched religiously since the eighth grade.', answer: 'The Bachelor' },
          { value: 400, question: 'This is the fruit Angela loves the most.', answer: 'Durian' },
          { value: 500, question: 'Round to the nearest 10. How many members of Angela’s family live in SF bay area?', answer: '60' },
        ],
      },
      {
        name: "Who's Wilson",
        clues: [
          { value: 100, question: 'Bang Bang _____ Gang. Name Wilson’s favorite NFL football team', answer: '49ers' },
          { value: 200, question: 'This is Wilson’s favorite sweet treat.', answer: 'Donuts' },
          { value: 300, question: 'Wilson recently broke a bone. What did he break? (Be specific)', answer: 'Right pinky finger' },
          {
            value: 400,
            question: 'Ready, Set, Donut!',
            hidden: true,
            instructions: 'Send 1 person up. Hands behind your back — race to finish the donut!',
          },
          { value: 500, question: 'Name all the bay area cities Wilson has lived in. (Hint: 6)', answer: 'Castro Valley, San Ramon, Dublin, Berkeley, Fremont, San Francisco' },
        ],
      },
      {
        name: 'A & W',
        clues: [
          { value: 100, question: 'Although Hinge is how they met, this is the school they both attended.', answer: 'UC Berkeley' },
          { value: 200, question: 'Unlike Mandarin, this is the Chinese dialect Angela and Wilson both speak.', answer: 'Cantonese' },
          { value: 300, question: 'What’s the couple’s favorite kind of chocolate?', answer: 'White chocolate' },
          { value: 400, question: 'Growing up, Angela and Wilson competed in different activities for the same number of years. Name each activity and the number of years.', answer: 'Angela: Chinese calligraphy\nWilson: karate\nBoth for 12 years!' },
          { value: 500, question: 'Six full-time companies between them, three apiece. What are they?', answer: 'Angela: Accenture, Salesforce, Visa\nWilson: Samsara, Twitch, Uber ' },
        ],
      },
      {
        name: 'Places, Please',
        clues: [
          { value: 100, image: 'places/100.jpg', answer: 'Korea' },
          { value: 200, image: 'places/200.jpg', answer: '49ers game' },
          { value: 300, image: 'places/300.jpg', answer: 'Las Vegas' },
          { value: 400, image: 'places/400.jpg', answer: 'Ed Sheeran concert' },
          { value: 500, image: 'places/500.jpg', answer: 'Point Bonita Lighthouse, Sausalito' },
        ],
      },
      {
        name: 'Wildcard',
        clues: [
          { value: 100, question: "Angela and Wilson's anniversary is on 8/21/22. What is 8 x 21 x 22?", answer: '3696' },
          { value: 200, question: 'The couple went rug tufting. What is on the rug?', answer: 'Duck holding a spatula', answerImage: 'wildcard/200-duck.jpg' },
          { value: 300, question: "What is Wilson's Twitch handle?", answer: 'ww_dubby_dubs' },
          { value: 400, question: 'Name the elementary, middle, and high schools Angela attended.', answer: 'Gordon J. Lau, Francisco, Galileo' },
          {
            value: 500,
            question: 'Til Nuggets Do Us Part',
            hidden: true,
            instructions: 'Send three people up. Relay order: 5 nuggets, then 3, then 2. Fastest team wins.',
          },
        ],
      },
    ];

    const FINAL_CLUE = {
      question: 'How many days from the first day they were official to the proposal day? Closest answer wins.',
      answer: '1,399 days',
    };

    function formatMoney(amount) {
      return amount < 0 ? `-$${Math.abs(amount)}` : `$${amount}`;
    }

    function buildInitialBoard() {
      return BOARD.map((cat) => ({
        ...cat,
        clues: cat.clues.map((c) => ({ ...c, revealed: false })),
      }));
    }

    function DoodleUnderline() {
      return (
        <svg className="doodle-underline" width="180" height="16" viewBox="0 0 180 16" fill="none">
          <path
            d="M2 8 C 30 2, 55 14, 90 7 S 150 2, 178 9"
            stroke="#742d49"
            strokeWidth="2.5"
            strokeLinecap="round"
            fill="none"
          />
        </svg>
      );
    }

    function Setup({ onStart }) {
      const [numTeams, setNumTeams] = useState(4);
      const [names, setNames] = useState(['', '', '', '']);

      const handleNumChange = (n) => {
        const clamped = Math.max(1, Math.min(8, n));
        setNumTeams(clamped);
        setNames((prev) => {
          const next = prev.slice(0, clamped);
          while (next.length < clamped) next.push('');
          return next;
        });
      };

      const handleNameChange = (i, value) => {
        setNames((prev) => {
          const next = [...prev];
          next[i] = value;
          return next;
        });
      };

      return (
        <React.Fragment>
        <div className="fade-in" style={styles.setupCard}>
          <h1 style={styles.title}>Angie &amp; Willy Jeopardy</h1>
          <DoodleUnderline />
          <p style={styles.subtitle}>Set up your teams to begin</p>

          <div style={styles.formRow}>
            <label style={styles.label}>Number of teams</label>
            <div style={styles.stepper}>
              <button style={styles.stepperBtn} onClick={() => handleNumChange(numTeams - 1)}>−</button>
              <span style={styles.stepperValue}>{numTeams}</span>
              <button style={styles.stepperBtn} onClick={() => handleNumChange(numTeams + 1)}>+</button>
            </div>
          </div>

          <div style={styles.teamInputs}>
            {names.map((name, i) => (
              <input
                key={i}
                style={styles.input}
                value={name}
                placeholder={`Team ${i + 1} name`}
                onChange={(e) => handleNameChange(i, e.target.value)}
              />
            ))}
          </div>

          <button
            className="pill-btn"
            style={styles.primaryBtn}
            onClick={() => onStart(names.map((n) => ({ name: n.trim() || 'Unnamed Team', score: 0 })))}
          >
            Begin the Game
          </button>
        </div>
        <button
          onClick={() => onStart(
            names.map((n) => ({ name: n.trim() || 'Unnamed Team', score: 0 })),
            true
          )}
          style={styles.devBtn}
        >
          Skip to FJ
        </button>
        </React.Fragment>
      );
    }

    function AnimatedScore({ value }) {
      const [display, setDisplay] = useState(value);
      const [flash, setFlash] = useState(false);
      const [confetti, setConfetti] = useState([]);
      const prevRef = useRef(value);
      const frameRef = useRef(null);
      const confettiIdRef = useRef(0);

      useEffect(() => {
        const prev = prevRef.current;
        if (prev === value) return;

        setFlash(true);

        const isUp = value > prev;
        const pieces = Array.from({ length: 8 }).map(() => {
          confettiIdRef.current += 1;
          const angle = Math.random() * Math.PI * 2;
          const distance = 22 + Math.random() * 26;
          return {
            id: confettiIdRef.current,
            dx: `${(Math.cos(angle) * distance).toFixed(0)}px`,
            dy: `${(Math.sin(angle) * distance - 10).toFixed(0)}px`,
            rot: `${(Math.random() * 360 - 180).toFixed(0)}deg`,
            color: isUp ? (Math.random() > 0.5 ? '#2e7d4f' : '#c9a227') : '#b3261e',
          };
        });
        setConfetti(pieces);
        const confettiTimer = setTimeout(() => setConfetti([]), 700);

        const duration = 550;
        const diff = value - prev;
        let startTime = null;

        const tick = (timestamp) => {
          if (startTime === null) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          setDisplay(Math.round(prev + diff * progress));
          if (progress < 1) {
            frameRef.current = requestAnimationFrame(tick);
          } else {
            setDisplay(value);
            prevRef.current = value;
            setTimeout(() => setFlash(false), 250);
          }
        };

        frameRef.current = requestAnimationFrame(tick);
        return () => {
          cancelAnimationFrame(frameRef.current);
          clearTimeout(confettiTimer);
        };
      }, [value]);

      return (
        <span style={styles.scoreValueWrap}>
          <span style={{ ...styles.scoreValue, ...(flash ? styles.scoreValueFlash : {}) }}>
            {formatMoney(display)}
          </span>
          {confetti.length > 0 && (
            <span className="score-confetti" aria-hidden="true">
              {confetti.map((p) => (
                <span key={p.id} style={{ background: p.color, '--dx': p.dx, '--dy': p.dy, '--rot': p.rot }} />
              ))}
            </span>
          )}
        </span>
      );
    }

    function Scoreboard({ teams, onSetScore }) {
      const [editingTeam, setEditingTeam] = useState(null);
      const [scoreDraft, setScoreDraft] = useState('');
      const maxScore = Math.max(...teams.map((t) => t.score));
      const hasLeader = maxScore > 0 && teams.filter((t) => t.score === maxScore).length === 1;
      const ordered = teams
        .map((t, i) => ({ ...t, origIdx: i }))
        .sort((a, b) => b.score - a.score);

      const beginEditing = (team) => {
        if (!onSetScore) return;
        setEditingTeam(team.origIdx);
        setScoreDraft(String(team.score));
      };

      const saveScore = () => {
        if (editingTeam === null) return;
        const nextScore = Number(scoreDraft);
        if (Number.isFinite(nextScore)) onSetScore(editingTeam, Math.round(nextScore));
        setEditingTeam(null);
      };

      return (
        <div style={styles.scoreboard}>
          {ordered.map((t) => {
            const isLeader = hasLeader && t.score === maxScore;
            return (
              <div key={t.origIdx} style={{ ...styles.scoreCard, ...(isLeader ? styles.scoreCardLeader : {}) }}>
                <div style={styles.scoreName}>
                  {isLeader && <span style={styles.crown}>👑</span>}
                  {t.name}
                </div>
                {editingTeam === t.origIdx ? (
                  <input
                    autoFocus
                    type="number"
                    value={scoreDraft}
                    onChange={(e) => setScoreDraft(e.target.value)}
                    onBlur={saveScore}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') e.currentTarget.blur();
                      if (e.key === 'Escape') setEditingTeam(null);
                    }}
                    style={styles.scoreEditInput}
                    aria-label={`Edit ${t.name} score`}
                  />
                ) : (
                  <span
                    onDoubleClick={() => beginEditing(t)}
                    title={onSetScore ? 'Double-click to edit' : undefined}
                    style={{ cursor: onSetScore ? 'text' : 'default' }}
                  >
                    <AnimatedScore value={t.score} />
                  </span>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function HiddenGameIntro({ label, onDone }) {
      const [exiting, setExiting] = useState(false);
      const timersRef = useRef([]);
      const onDoneRef = useRef(onDone);
      onDoneRef.current = onDone;

      const finish = () => {
        timersRef.current.forEach(clearTimeout);
        setExiting(true);
        timersRef.current = [setTimeout(() => onDoneRef.current(), 600)];
      };

      useEffect(() => {
        timersRef.current = [setTimeout(finish, 3400)];
        return () => timersRef.current.forEach(clearTimeout);
      }, []);

      const sparkles = React.useMemo(
        () =>
          Array.from({ length: 18 }).map((_, i) => ({
            id: i,
            top: Math.random() * 100,
            left: Math.random() * 100,
            size: 0.8 + Math.random() * 1.6,
            delay: Math.random() * 1.8,
          })),
        []
      );

      const letters = 'HIDDEN GAME'.split('');

      return (
        <div
          className={exiting ? 'hidden-intro-exit' : ''}
          style={styles.hiddenIntro}
        >
          <div className="hidden-rays" style={styles.hiddenRays} aria-hidden="true" />
          <div className="hidden-ring" style={styles.hiddenRing} aria-hidden="true" />
          <div
            className="hidden-ring"
            style={{ ...styles.hiddenRing, animationDelay: '0.7s' }}
            aria-hidden="true"
          />
          <div
            className="hidden-ring"
            style={{ ...styles.hiddenRing, animationDelay: '1.4s' }}
            aria-hidden="true"
          />
          {sparkles.map((s) => (
            <span
              key={s.id}
              className="hidden-sparkle"
              aria-hidden="true"
              style={{
                position: 'absolute',
                top: `${s.top}%`,
                left: `${s.left}%`,
                fontSize: `${s.size}rem`,
                animationDelay: `${s.delay}s`,
              }}
            >
              ✦
            </span>
          ))}
          <div className="hidden-flash" style={styles.hiddenFlashLayer} aria-hidden="true" />

          <div style={styles.hiddenInner}>
            <div
              className="hidden-fade-up"
              style={{ ...styles.hiddenEyebrow, animationDelay: '0.8s' }}
            >
              You found a
            </div>
            <div style={styles.hiddenRow}>

    function CluePanel({ clue, category, teams, onAdjust, onClose }) {
      const [showIntro, setShowIntro] = useState(Boolean(clue.hidden));
      const [showAnswer, setShowAnswer] = useState(false);
      const [pending, setPending] = useState({}); // { teamIdx: netDelta }
      const [wagerAmount, setWagerAmount] = useState({});

      const handleAdjust = (teamIdx, delta) => {
        setPending((prev) => ({ ...prev, [teamIdx]: (prev[teamIdx] || 0) + delta }));
      };

      const applyWager = (teamIdx, won) => {
        const score = teams[teamIdx].score;
        const entered = Math.max(0, Number(wagerAmount[teamIdx]) || 0);

        if (score < 0) {
          setPending((prev) => ({ ...prev, [teamIdx]: won ? -score : 0 }));
          return;
        }
        if (score === 0) {
          setPending((prev) => ({ ...prev, [teamIdx]: won ? clue.value : 0 }));
          return;
        }

        const wager = Math.min(entered, score);
        if (!wager) {
          setPending((prev) => ({ ...prev, [teamIdx]: 0 }));
          return;
        }
        setPending((prev) => ({ ...prev, [teamIdx]: won ? wager : -wager }));
      };

      const handleWagerChange = (teamIdx, value) => {
        setWagerAmount((prev) => ({ ...prev, [teamIdx]: value }));
        if ((Number(value) || 0) === 0) {
          setPending((prev) => ({ ...prev, [teamIdx]: 0 }));
        }
      };

      const handleDone = () => {
        Object.entries(pending).forEach(([idxStr, delta]) => {
          if (delta) onAdjust(Number(idxStr), delta);
        });
        onClose();
      };

      const handleBackToInstructions = () => {
        setShowAnswer(false);
        setPending({});
        setWagerAmount({});
      };

      if (showIntro) {
        return (
          <div style={styles.overlay}>
            <HiddenGameIntro
              label={clue.question}
              onDone={() => setShowIntro(false)}
            />
          </div>
        );
      }

      return (
        <div style={styles.overlay}>
          <div className="fade-in" style={styles.cluePanel}>
            <div style={styles.clueCategory}>
              {clue.hidden ? category : `${category} · $${clue.value}`}
            </div>
            {clue.image && (
              <img
                src={clue.image}
                alt=""
                style={showAnswer ? styles.clueImageSmall : styles.clueImage}
              />
            )}
            {clue.question ? (
              <div
                style={{
                  ...(showAnswer ? styles.clueTextSmall : styles.clueText),
                  ...(clue.instructions ? { marginBottom: '0.7rem' } : {}),
                }}
              >
                {clue.question}
              </div>
            ) : null}
            {clue.instructions ? (
              <div
                style={
                  showAnswer && clue.hidden
                    ? { ...styles.clueInstructionsSmall, marginBottom: '2.5rem' }
                    : showAnswer
                      ? styles.clueInstructionsSmall
                      : styles.clueInstructions
                }
              >
                {clue.instructions}
              </div>
            ) : null}

            {clue.hidden && !showAnswer && (
              <div style={{ width: '100%', maxWidth: '600px' }}>
                <div style={styles.scoringLabel}>Wager your points:</div>
                <div style={{ ...styles.clueInstructionsSmall, maxWidth: '600px', marginBottom: '2.5rem' }}>
                  Teams with points can wager up to their current score.<br />
                  Teams at $0 or below can’t wager. A win takes a negative team back to $0, and gives a team at $0 the tile’s value.
                </div>
              </div>
            )}

            {!showAnswer && (
              <button className="pill-btn" style={styles.revealBtn} onClick={() => setShowAnswer(true)}>
                {clue.hidden ? 'Proceed' : 'Reveal Answer'}
              </button>
            )}

            {showAnswer && (
              <React.Fragment>
                {clue.answer && (
                  <div className="answer-reveal" style={styles.answerText}>{clue.answer}</div>
                )}
                {clue.answerImage && (
                  <div style={styles.answerImageSlot}>
                    <img className="answer-reveal" src={clue.answerImage} alt="" style={styles.answerImage} />
                  </div>
                )}
                <div style={styles.scoringLabel}>
                  {clue.hidden ? 'Enter a wager, then mark the result' : 'Award or deduct points'}
                </div>
                <div style={clue.hidden ? { ...styles.scoringList, maxWidth: '820px' } : styles.scoringList}>
                  {teams.map((t, i) => {
                    const delta = pending[i] || 0;
                    return (
                      <div key={i} style={clue.hidden ? styles.scoringRowWager : styles.scoringRow}>
                        <span style={styles.scoringName}>{t.name}</span>
                        <span style={styles.scoringScore}>{formatMoney(t.score)}</span>
                        <span style={{ ...styles.pendingCol, color: delta > 0 ? '#2e7d4f' : '#b3261e' }}>
                          {delta !== 0 && `(${delta > 0 ? '+' : ''}${formatMoney(delta)} pending)`}
                        </span>
                        {clue.hidden ? (
                          <React.Fragment>
                            <span style={styles.wagerSlot}>
                              {t.score > 0 ? (
                                <input
                                  type="number"
                                  min="0"
                                  max={t.score}
                                  placeholder={`Up to $${t.score}`}
                                  value={wagerAmount[i] || ''}
                                  onChange={(e) => handleWagerChange(i, e.target.value)}
                                  style={styles.customInput}
                                />
                              ) : (
                                <span style={{ ...styles.pendingNote, whiteSpace: 'nowrap' }}>
                                  {t.score < 0 ? 'Win → $0' : `Win → +$${clue.value}`}
                                </span>
                              )}
                            </span>
                            <button className="pill-btn" style={styles.minusBtn} onClick={() => applyWager(i, false)}>
                              ✗ Lost
                            </button>
                            <button className="pill-btn" style={styles.plusBtn} onClick={() => applyWager(i, true)}>
                              ✓ Won
                            </button>
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            <button
                              className="pill-btn"
                              style={styles.minusBtn}
                              onClick={() => handleAdjust(i, -clue.value)}
                            >
                              − ${clue.value}
                            </button>
                            <button
                              className="pill-btn"
                              style={styles.plusBtn}
                              onClick={() => handleAdjust(i, clue.value)}
                            >
                              + ${clue.value}
                            </button>
                          </React.Fragment>
                        )}
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                  {clue.hidden && (
                    <button className="pill-btn" style={styles.secondaryBtn} onClick={handleBackToInstructions}>
                      Back to Instructions
                    </button>
                  )}
                  <button className="pill-btn" style={styles.secondaryBtn} onClick={handleDone}>
                    Back to Board
                  </button>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function FinalJeopardyQuestion({ onDone }) {
      const [stage, setStage] = useState('hidden'); // 'hidden' | 'question'
      const [timeLeft, setTimeLeft] = useState(40);

      useEffect(() => {
        if (stage !== 'question' || timeLeft <= 0) return;
        const id = setTimeout(() => setTimeLeft((t) => t - 1), 1000);
        return () => clearTimeout(id);
      }, [stage, timeLeft]);

      useEffect(() => {
        if (stage === 'question' && timeLeft === 31) {
          const audio = document.getElementById('final-jeopardy-theme');
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
          }
        }
      }, [stage, timeLeft]);

      const timeUp = timeLeft <= 0;

      return (
        <div style={styles.overlay}>
          <div className="fade-in" style={styles.cluePanel}>
            <div style={styles.finalLabel}>Final Jeopardy</div>
            <DoodleUnderline />

            {stage === 'hidden' && (
              <React.Fragment>
                <div style={styles.finalInstructions}>
                  Each team writes down a wager and an answer before time runs out.
                </div>
                <button className="pill-btn" style={styles.revealBtn} onClick={() => setStage('question')}>
                  Start
                </button>
              </React.Fragment>
            )}

            {stage === 'question' && (
              <React.Fragment>
                <div style={styles.clueText}>{FINAL_CLUE.question}</div>
                <div style={{ ...styles.finalTimer, ...(timeUp ? styles.finalTimerDone : {}) }}>
                  {timeUp ? "Time's Up!" : timeLeft}
                </div>
                <button className="pill-btn" style={styles.revealBtn} onClick={onDone}>
                  Enter Wagers
                </button>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function FinalJeopardyScoring({ teams, onAdjust, onDone }) {
      const [pending, setPending] = useState({});
      const [wagerAmount, setWagerAmount] = useState({});
      const [showAnswer, setShowAnswer] = useState(false);

      const maxWagerFor = (i) => Math.max(0, teams[i].score);

      const applyResult = (i, correct) => {
        const entered = Math.max(0, Number(wagerAmount[i]) || 0);
        const wager = Math.min(entered, maxWagerFor(i));
        if (!wager) return;
        const delta = correct ? wager : -wager;
        setPending((prev) => ({ ...prev, [i]: (prev[i] || 0) + delta }));
      };

      const handleWagerChange = (i, value) => {
        if (value === '') {
          setWagerAmount((prev) => ({ ...prev, [i]: '' }));
          return;
        }
        const entered = Number(value);
        if (!Number.isFinite(entered) || entered < 0) return;
        const max = maxWagerFor(i);
        const clamped = Math.min(entered, max);
        setWagerAmount((prev) => ({
          ...prev,
          [i]: clamped === entered ? value : String(clamped),
        }));
      };

      const handleDone = () => {
        Object.entries(pending).forEach(([idxStr, delta]) => {
          if (delta) onAdjust(Number(idxStr), delta);
        });
        onDone();
      };

      return (
        <div style={styles.overlay}>
          <div className="fade-in" style={styles.cluePanel}>
            <div style={styles.finalLabel}>Final Jeopardy</div>
            <DoodleUnderline />
            {showAnswer && (
              <div className="answer-reveal" style={styles.answerText}>{FINAL_CLUE.answer}</div>
            )}
            <div style={{ ...styles.scoringLabel, marginBottom: showAnswer ? '1.25rem' : '0.4rem' }}>
              {showAnswer ? 'Award or deduct points' : 'Enter each team’s wager'}
            </div>
            {!showAnswer && (
              <div style={{ ...styles.clueInstructionsSmall, maxWidth: '600px', marginBottom: '1.25rem' }}>
                Each team can wager up to their current score.
              </div>
            )}
            <div style={{ ...styles.scoringList, maxWidth: '860px' }}>
              {teams.map((t, i) => {
                const delta = pending[i] || 0;
                return (
                  <div key={i} style={styles.scoringRowWager}>
                    <span style={styles.scoringName}>{t.name}</span>
                    <span style={styles.scoringScore}>{formatMoney(t.score)}</span>
                    <span style={{ ...styles.pendingCol, color: delta > 0 ? '#2e7d4f' : '#b3261e' }}>
                      {delta !== 0 && `(${delta > 0 ? '+' : ''}${formatMoney(delta)} pending)`}
                    </span>
                    <span style={styles.wagerSlot}>
                      <input
                        type="number"
                        min="0"
                        max={maxWagerFor(i)}
                        placeholder={t.score > 0 ? `Up to $${t.score}` : 'Up to $0'}
                        value={wagerAmount[i] || ''}
                        onChange={(e) => handleWagerChange(i, e.target.value)}
                        style={styles.customInput}
                        disabled={showAnswer || t.score <= 0}
                      />
                    </span>
                    {showAnswer && (
                      <React.Fragment>
                        <button className="pill-btn" style={styles.minusBtn} onClick={() => applyResult(i, false)}>
                          ✗ Incorrect
                        </button>
                        <button className="pill-btn" style={styles.plusBtn} onClick={() => applyResult(i, true)}>
                          ✓ Correct
                        </button>
                      </React.Fragment>
                    )}
                  </div>
                );
              })}
            </div>
            {showAnswer ? (
              <button className="pill-btn" style={styles.secondaryBtn} onClick={handleDone}>
                Finish Game
              </button>
            ) : (
              <button className="pill-btn" style={{ ...styles.revealBtn, marginTop: '2rem' }} onClick={() => setShowAnswer(true)}>
                Reveal Answer
              </button>
            )}
          </div>
        </div>
      );
    }

    function GameBoard({ board, setBoard, teams, setTeams, startAtFinal }) {
      const [active, setActive] = useState(null); // { catIdx, clueIdx }
      const [finalPhase, setFinalPhase] = useState(startAtFinal ? 'question' : 'board'); // 'board' | 'question' | 'scoring' | 'done'
      const cheatRef = useRef(0);

      const handleTitleTap = () => {
        cheatRef.current += 1;
        if (cheatRef.current >= 5) {
          cheatRef.current = 0;
          setBoard((prev) =>
            prev.map((cat) => ({
              ...cat,
              clues: cat.clues.map((c) => ({ ...c, revealed: true })),
            }))
          );
        }
      };

      const openClue = (catIdx, clueIdx) => {
        const clue = board[catIdx].clues[clueIdx];
        if (clue.revealed) return;
        if (clue.hidden) {
          const audio = document.getElementById('hidden-game-fanfare');
          if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
          }
        }
        setActive({ catIdx, clueIdx });
      };

      const closeClue = () => {
        setBoard((prev) => {
          const next = prev.map((c) => ({ ...c, clues: c.clues.map((cl) => ({ ...cl })) }));
          next[active.catIdx].clues[active.clueIdx].revealed = true;
          return next;
        });
        setActive(null);
      };

      const adjustScore = (teamIdx, delta) => {
        setTeams((prev) => {
          const next = [...prev];
          next[teamIdx] = { ...next[teamIdx], score: next[teamIdx].score + delta };
          return next;
        });
      };

      const setScore = (teamIdx, score) => {
        setTeams((prev) => {
          const next = [...prev];
          next[teamIdx] = { ...next[teamIdx], score };
          return next;
        });
      };

      const allRevealed = board.every((cat) => cat.clues.every((c) => c.revealed));

      if (allRevealed && finalPhase === 'question') {
        return <FinalJeopardyQuestion onDone={() => setFinalPhase('scoring')} />;
      }
      if (allRevealed && finalPhase === 'scoring') {
        return (
          <FinalJeopardyScoring
            teams={teams}
            onAdjust={adjustScore}
            onDone={() => setFinalPhase('done')}
          />
        );
      }
      if (allRevealed && finalPhase === 'done') {
        return <GameOverScreen teams={teams} />;
      }

      return (
        <div>
          <h1 style={styles.title} onClick={handleTitleTap}>Angie &amp; Willy Jeopardy</h1>
          <DoodleUnderline />
          <Scoreboard teams={teams} onSetScore={setScore} />

          <div style={{ position: 'relative' }}>
            <div style={styles.board}>
              {board.map((cat, catIdx) => (
                <div
                  key={catIdx}
                  className="category-in"
                  style={{ ...styles.categoryColumn, animationDelay: `${catIdx * 0.08}s` }}
                >
                  <div style={styles.categoryHeader}>{cat.name}</div>
                  {cat.clues.map((clue, clueIdx) => (
                    <button
                      key={clueIdx}
                      className={clue.revealed ? 'tile-btn used' : 'tile-btn'}
                      style={clue.revealed ? styles.clueCellUsed : styles.clueCell}
                      onClick={() => openClue(catIdx, clueIdx)}
                      disabled={clue.revealed}
                    >
                      {clue.revealed ? '♥' : `$${clue.value}`}
                    </button>
                  ))}
                </div>
              ))}
            </div>

            {allRevealed && finalPhase === 'board' && (
              <div style={{
                position: 'absolute',
                inset: 0,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                zIndex: 10,
                background: 'rgba(255, 250, 246, 0.7)',
                borderRadius: '10px',
              }}>
                <button
                  className="pill-btn reveal-btn-pulse"
                  style={{
                    ...styles.primaryBtn,
                    maxWidth: '340px',
                    padding: '1rem 2.2rem',
                    fontSize: '1.05rem',
                    boxShadow: '0 16px 50px rgba(116, 45, 73, 0.55)',
                  }}
                  onClick={() => setFinalPhase('question')}
                >
                  Proceed to Final Jeopardy
                </button>
              </div>
            )}
          </div>

          {active && (
            <CluePanel
              clue={board[active.catIdx].clues[active.clueIdx]}
              category={board[active.catIdx].name}
              teams={teams}
              onAdjust={adjustScore}
              onClose={closeClue}
            />
          )}
        </div>
      );
    }

    function App() {
      const [phase, setPhase] = useState('setup'); // 'setup' | 'playing'
      const [teams, setTeams] = useState([]);
      const [board, setBoard] = useState(buildInitialBoard());
      const [startAtFinal, setStartAtFinal] = useState(false);

      const startGame = (initialTeams, skipToFinal = false) => {
        setTeams(initialTeams);
        setBoard(
          buildInitialBoard().map((cat) => ({
            ...cat,
            clues: cat.clues.map((clue) => ({ ...clue, revealed: skipToFinal })),
          }))
        );
        setStartAtFinal(skipToFinal);
        setPhase('playing');
      };

      if (phase === 'setup') {
        return <Setup onStart={startGame} />;
      }

      return (
        <GameBoard
          board={board}
          setBoard={setBoard}
          teams={teams}
          setTeams={setTeams}
          startAtFinal={startAtFinal}
        />
      );
    }
