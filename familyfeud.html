    :root {
      --wine: #742d49;
      --wine-soft: rgba(116, 45, 73, 0.55);
      --wine-faint: rgba(116, 45, 73, 0.14);
      --white: #ffffff;
      --cream: #fffaf6;
      --gold: #c9a227;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      min-height: 100vh;
      color: var(--wine);
      padding: 2rem 1rem;
    }
    .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

    .bg-decor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .bg-decor .float-item {
      position: absolute;
      opacity: 0.22;
      animation: float-drift ease-in-out infinite;
    }
    .bg-decor .float-item.heart {
      color: #742d49;
    }
    @keyframes float-drift {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-42px) rotate(8deg); }
    }
    @keyframes fade-up {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes tile-flip {
      0% { transform: rotateX(0deg) scale(0.9); opacity: 0.4; }
      50% { transform: rotateX(90deg) scale(1.05); opacity: 1; }
      100% { transform: rotateX(0deg) scale(1); opacity: 1; }
    }
    @keyframes row-in {
      0% { opacity: 0; transform: translateX(-20px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes points-fly {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-46px) scale(1.2); opacity: 0; }
    }
    @keyframes strike-stamp {
      0% { transform: scale(2.4) rotate(-25deg); opacity: 0; }
      60% { transform: scale(0.9) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(-6deg); opacity: 1; }
    }
    @keyframes board-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-0.5deg); }
      40% { transform: translateX(9px) rotate(0.5deg); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(6px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(116, 45, 73, 0.4); }
      50% { box-shadow: 0 0 0 14px rgba(116, 45, 73, 0); }
    }
    @keyframes timer-ring-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .timer-ring-pulse {
      animation: timer-ring-pulse 0.6s ease-in-out infinite;
      color: #b3261e;
    }
    @keyframes money-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(var(--spin)); }
    }
    @keyframes strike-box-flash {

      35% { background: rgba(179, 38, 30, 0.35); transform: scale(1.15); }
      100% { background: rgba(179, 38, 30, 0); transform: scale(1); }

    .strike-box-flash {
      animation: strike-box-flash 0.5s ease;
    }
    @keyframes score-card-glow {

    function formatPts(n) {
      return n < 0 ? `-${Math.abs(n)}` : `${n}`;

    function Setup({ onStart }) {
      const [numTeams, setNumTeams] = useState(2);
      const [names, setNames] = useState(['', '']);

      const handleNumChange = (n) => {
        const clamped = Math.max(2, Math.min(4, n));
        setNumTeams(clamped);
        setNames((prev) => {
          const next = prev.slice(0, clamped);
          while (next.length < clamped) next.push('');
          return next;
        });
      };

      const handleNameChange = (i, value) => {
        setNames((prev) => {
          const next = [...prev];
          next[i] = value;
          return next;
        });
      };

      return (
        <div className="fade-in" style={styles.setupCard}>
          <h1 style={styles.title}>Angie &amp; Willy Family Feud</h1>
          <DoodleUnderline />
          <p style={styles.subtitle}>Set up your teams to begin</p>

          <div style={styles.formRow}>
            <label style={styles.label}>Number of teams</label>
            <div style={styles.stepper}>
              <button style={styles.stepperBtn} onClick={() => handleNumChange(numTeams - 1)}>−</button>
              <span style={styles.stepperValue}>{numTeams}</span>
              <button style={styles.stepperBtn} onClick={() => handleNumChange(numTeams + 1)}>+</button>
            </div>
          </div>

          <div style={styles.teamInputs}>
            {names.map((name, i) => (
              <input
                key={i}
                style={styles.input}
                value={name}
                placeholder={`Team ${i + 1} name`}
                onChange={(e) => handleNameChange(i, e.target.value)}
              />
            ))}
          </div>

          <button
            className="pill-btn"
            style={styles.primaryBtn}
            onClick={() => onStart(names.map((n) => ({ name: n.trim() || 'Unnamed Team', score: 0, roundScore: 0 })))}

    function AnimatedNumber({ value, style, flashClass }) {
      const [display, setDisplay] = useState(value);
      const [flash, setFlash] = useState(false);
      const prevRef = useRef(value);
      const frameRef = useRef(null);

      useEffect(() => {
        const prev = prevRef.current;
        if (prev === value) return;
        setFlash(true);
        const duration = 500;
        const diff = value - prev;
        let startTime = null;

        const tick = (timestamp) => {
          if (startTime === null) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          setDisplay(Math.round(prev + diff * progress));
          if (progress < 1) {
            frameRef.current = requestAnimationFrame(tick);
          } else {
            setDisplay(value);
            prevRef.current = value;
            setTimeout(() => setFlash(false), 250);
          }
        };
        frameRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frameRef.current);
      }, [value]);

      return (
        <span className={flash ? flashClass : ''} style={style}>
          {formatPts(display)}
        </span>
      );
    }

    function Scoreboard({ teams }) {
      const maxScore = Math.max(...teams.map((t) => t.score));
      const hasLeader = maxScore > 0 && teams.filter((t) => t.score === maxScore).length === 1;
      const [glowIdx, setGlowIdx] = useState(null);
      const prevScoresRef = useRef(teams.map((t) => t.score));

      useEffect(() => {
        const prev = prevScoresRef.current;
        const changedIdx = teams.findIndex((t, i) => t.score > (prev[i] ?? t.score));
        prevScoresRef.current = teams.map((t) => t.score);
        if (changedIdx === -1) return;
        setGlowIdx(changedIdx);
        const id = setTimeout(() => setGlowIdx(null), 900);
        return () => clearTimeout(id);
      }, [teams]);

      return (
        <div style={styles.scoreboard}>
          {teams.map((t, i) => {
            const isLeader = hasLeader && t.score === maxScore;
            return (
              <div
                key={i}
                className={glowIdx === i ? 'score-card-glow' : ''}
                style={{ ...styles.scoreCard, ...(isLeader ? styles.scoreCardLeader : {}) }}
              >
                <div style={styles.scoreName}>
                  {isLeader && <span style={styles.crown}>👑</span>}
                  {t.name}
                </div>
                <AnimatedNumber value={t.score} style={styles.scoreValue} flashClass="pot-flash" />
              </div>
            );
          })}
        </div>
      );

    function MoneyRain({ count = 30 }) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const id = setTimeout(() => setVisible(true), 500);
        return () => clearTimeout(id);
      }, []);

      const pieces = React.useMemo(
        () =>
          Array.from({ length: count }).map((_, i) => {
            const depth = Math.random();
            const isFar = depth < 0.4;
            const isMid = depth < 0.75;
            return {
              id: i,
              left: Math.random() * 100,
              duration: 3.2 + Math.random() * 1.8,
              delay: i * 0.25 + Math.random() * 0.4,
              size: isFar ? 1.0 + Math.random() * 0.4 : isMid ? 1.6 + Math.random() * 0.6 : 2.2 + Math.random() * 0.6,
              opacity: isFar ? 0.15 : isMid ? 0.25 : 0.35,
              spin: 15 + Math.random() * 30,
            };
          }),
        [count]
      );

      if (!visible) return null;

      return (
        <div style={{ ...styles.confettiWrap, zIndex: 0, pointerEvents: 'none' }} aria-hidden="true">
          {pieces.map((p) => (
            <span
              key={p.id}
              style={{
                position: 'absolute',
                top: '-5%',
                left: `${p.left}%`,
                fontSize: `${p.size}rem`,
                opacity: p.opacity,
                animation: `confetti-fall ${p.duration}s linear ${p.delay}s infinite`,
              }}
            >
              <span style={{
                display: 'inline-block',
                '--spin': `${p.spin}deg`,
                animation: `money-spin ${2 + Math.random() * 2}s ease-in-out infinite alternate`,
              }}>💵</span>
            </span>
          ))}
        </div>
      );
    }

    function RoundConfetti({ count = 26 }) {
      const colors = ['#742d49', '#c9a227', '#2e7d4f', '#ffffff', '#e8b4c8', '#f4d35e'];
      const pieces = React.useMemo(
        () =>
          Array.from({ length: count }).map((_, i) => ({
            id: i,
            left: Math.random() * 100,
            color: colors[Math.floor(Math.random() * colors.length)],
            duration: 2.2 + Math.random() * 1.6,
            delay: Math.random() * 0.5,
            width: 6 + Math.random() * 6,
          })),
        [count]
      );
      return (
        <div style={styles.confettiWrap} aria-hidden="true">
          {pieces.map((p) => (
            <span
              key={p.id}
              style={{
                position: 'absolute',
                top: '-5%',
                left: `${p.left}%`,
                width: `${p.width}px`,
                height: `${p.width * 0.4}px`,
                background: p.color,
                borderRadius: '2px',
                animation: `confetti-fall ${p.duration}s linear ${p.delay}s infinite`,
              }}
            />
          ))}
        </div>
      );
    }

    function FeudBoard({ round, roundNumber, totalRounds, teams, onAwardPot, onNextRound, isLastRound }) {
      const [revealed, setRevealed] = useState(() => round.answers.map(() => false));
      const [flyId, setFlyId] = useState(null);
      const [flyIndex, setFlyIndex] = useState(null);
      const [strikes, setStrikes] = useState(0);
      const [shake, setShake] = useState(false);
      const [awarded, setAwarded] = useState(false);
      const [celebrate, setCelebrate] = useState(false);
      const [bigStrike, setBigStrike] = useState(false);
      const [bigStrikeCount, setBigStrikeCount] = useState(0);
      const [questionRevealed, setQuestionRevealed] = useState(false);
      const [frozenPot, setFrozenPot] = useState(null);
      const [roundWon, setRoundWon] = useState(false);
      const flyIdRef = useRef(0);

      const livePot = round.answers.reduce((sum, a, i) => (revealed[i] ? sum + a.points : sum), 0);
      const pot = roundWon ? frozenPot : livePot;

      useEffect(() => {
        playSound('feud-faceoff-sound');
      }, []);

      const revealAnswer = (i) => {
        if (revealed[i] || !questionRevealed) return;
        const next = revealed.map((r, idx) => (idx === i ? true : r));
        setRevealed(next);
        playSound('feud-correct-sound');
        if (awarded || roundWon) return;
        flyIdRef.current += 1;
        setFlyId(flyIdRef.current);
        setFlyIndex(i);
        setTimeout(() => setFlyId((cur) => (cur === flyIdRef.current ? null : cur)), 900);
        if (strikes === 3 || next.every(Boolean)) {
          const wonPot = round.answers.reduce((sum, a, idx) => (next[idx] ? sum + a.points : sum), 0);
          setFrozenPot(wonPot);
          setRoundWon(true);
          setTimeout(() => playSound('feud-win-sound'), 500);
        }
      };

      const addStrike = () => {
        if (awarded || roundWon || !questionRevealed) return;
        const alreadyMaxed = strikes === 3;
        const next = Math.min(3, strikes + 1);
        setStrikes(next);
        setShake(true);
        setTimeout(() => setShake(false), 500);
        setBigStrikeCount(next);
        setBigStrike(true);
        setTimeout(() => setBigStrike(false), 1800);
        playSound('feud-buzzer-sound');
        if (alreadyMaxed) {
          setFrozenPot(livePot);
          setRoundWon(true);
          setTimeout(() => playSound('feud-win-sound'), 900);
        }
      };

      const resetStrikes = () => setStrikes(0);

      const awardTo = (teamIdx) => {
        if (awarded) return;
        onAwardPot(teamIdx, pot);
        setFrozenPot(pot);
        setAwarded(true);
        setCelebrate(true);
      };

      const goNext = () => {
        onNextRound();
      };

      return (
        <div>
          <h1 style={styles.title}>Angie &amp; Willy Family Feud</h1>
          <DoodleUnderline />
          <Scoreboard teams={teams} />

          <div className="round-slide-in">
          <div className="fade-in" style={styles.roundLabel}>
            Round {roundNumber} of {totalRounds}
          </div>

          <div
            className="fade-in"
            style={{ ...styles.questionCard, cursor: questionRevealed ? 'default' : 'pointer' }}
            onClick={() => setQuestionRevealed(true)}
          >
            <span style={styles.questionText}>
              {questionRevealed ? round.question : 'Tap to reveal the question'}
            </span>
          </div>

          <div style={styles.potRow}>
            <div style={styles.potLabel}>Pot</div>
            <AnimatedNumber value={pot} style={styles.potValue} flashClass="pot-flash" />
          </div>

          <div className={shake ? 'board-shake-active' : ''} style={styles.answerBoard}>
            {Array.from({ length: 8 }).map((_, i) => {
              const a = round.answers[i];
              if (!a) {
                return (
                  <button
                    key={i}
                    className="tile-btn"
                    style={styles.answerTilePlaceholder}
                    disabled
                  ></button>
                );
              }
              const isRevealed = revealed[i];
              return (
                <button
                  key={i}
                  className={`tile-btn row-in ${isRevealed ? 'tile-revealed' : ''}`}
                  style={{
                    ...(isRevealed ? styles.answerTileRevealed : styles.answerTileHidden),
                    animationDelay: `${i * 0.06}s`,
                  }}
                  onClick={() => revealAnswer(i)}
                  disabled={isRevealed || !questionRevealed}
                >
                  <span style={styles.answerRank}>{i + 1}</span>
                  <span style={styles.answerLabel}>{isRevealed ? a.text : ''}</span>
                  {isRevealed && <span style={styles.answerPoints}>{a.points}</span>}
                  {isRevealed && flyId && flyIndex === i && (
                    <span className="points-fly-item" style={styles.pointsFly}>+{a.points}</span>
                  )}
                </button>
              );
            })}
          </div>

          {!roundWon && (
            <div style={styles.strikeRow}>
              <div style={styles.strikeBoxes}>
                {[0, 1, 2].map((i) => (
                  <div
                    key={i}
                    className={shake && i === strikes - 1 ? 'strike-box-flash' : ''}
                    style={styles.strikeBox}
                  >
                    {i < strikes && <span className="strike-x" style={styles.strikeX}>✗</span>}
                  </div>
                ))}
              </div>
              <button className="pill-btn" style={styles.strikeBtn} onClick={addStrike} disabled={awarded || !questionRevealed}>
                Add Strike
              </button>
              <button className="pill-btn" style={styles.secondaryBtnSmall} onClick={resetStrikes} disabled={awarded || !questionRevealed}>
                Reset Strikes
              </button>
            </div>
          )}

          {roundWon && !awarded && (
            <div style={styles.awardSection}>
              <div style={styles.awardLabel}>Award the pot to:</div>
              <div style={styles.awardButtons}>
                {teams.map((t, i) => (
                  <button key={i} className="pill-btn" style={styles.plusBtn} onClick={() => awardTo(i)}>
                    {t.name}
                  </button>
                ))}
              </div>
            </div>
          )}

          {awarded && (
            <div style={{ position: 'relative', textAlign: 'center' }}>
              {celebrate && <RoundConfetti count={45} />}
              <button className="pill-btn" style={styles.primaryBtnInline} onClick={goNext}>
                {isLastRound ? 'Proceed to Fast Money' : 'Next Round'}
              </button>
            </div>
          )}
          </div>

          {bigStrike && (
            <div style={styles.bigStrikeOverlay} aria-hidden="true">
              {Array.from({ length: bigStrikeCount }).map((_, i) => (
                <span key={i} className="big-strike-x" style={{ animationDelay: `${i * 0.08}s` }}>✗</span>
              ))}
            </div>
          )}
        </div>
      );
    }

    const RANK_MEDALS_NONE = null;

    function GameOverScreen({ teams }) {
      const ranked = teams.slice().sort((a, b) => b.score - a.score);
      const winner = ranked[0];
      const rest = ranked.slice(1);

      useEffect(() => {
        playSound('feud-victory-sound');
      }, []);

      return (
        <div style={styles.overlay}>
          <RoundConfetti count={130} />
          <div className="gameover-bounce" style={styles.gameOverScreen}>
            <div style={styles.gameOverSparkleRow}>
              <span className="gameover-sparkle" style={{ animationDelay: '0s' }}>✨</span>
              <div style={styles.gameOverCrown}>👑</div>
              <span className="gameover-sparkle" style={{ animationDelay: '0.4s' }}>✨</span>
            </div>
            <div style={styles.gameOverTitle}>Congratulations!</div>
            <DoodleUnderline />
            <div style={styles.gameOverWinnerLabel}>Winner</div>
            <div style={styles.gameOverWinnerName}>{winner.name}</div>
            <div style={styles.gameOverWinnerScore}>{formatPts(winner.roundScore)}</div>
            {winner.score - winner.roundScore > 0 && (
              <div style={styles.fastMoneySubScore}>
                + {formatPts(winner.score - winner.roundScore)} Fast Money
              </div>
            )}

            {rest.length > 0 && (
              <div style={styles.rankList}>
                {rest.map((t, i) => (
                  <div
                    key={t.name + i}
                    className="fade-in"
                    style={{ ...styles.rankRow, animationDelay: `${0.15 + i * 0.1}s` }}
                  >
                    <span style={styles.rankMedal}>{`#${i + 2}`}</span>
                    <span style={styles.rankName}>{t.name}</span>
                    <span style={styles.rankScore}>{formatPts(t.roundScore)}</span>
                    {t.score - t.roundScore > 0 && (
                      <span style={styles.fastMoneySubScoreSmall}>
                        + {formatPts(t.score - t.roundScore)} FM
                      </span>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function FastMoneyIntro({ teams, onStart }) {
      const winnerIdx = teams.reduce((best, t, i) => (t.score > teams[best].score ? i : best), 0);
      return (
        <div style={styles.overlay}>
          <div className="fade-in" style={styles.panelCard}>
            <div style={styles.finalLabel}>Fast Money</div>
            <DoodleUnderline />
            <div style={styles.finalInstructions}>
              {teams[winnerIdx].name} won the rounds and will play Fast Money!
              Send up two players. Each player will answer all 5 questions within the time limit.
              Combine both scores — 200 points wins the bonus round!
            </div>
            <button
              className="pill-btn"
              style={{ ...styles.primaryBtnInline, padding: '0.825rem 1.925rem', fontSize: '0.99rem' }}
              onClick={() => onStart(winnerIdx)}
            >
              Start Fast Money
            </button>
          </div>
        </div>
      );
    }

    function FastMoneyRound({ playerLabel, teamName, timeLimit, onDone, previousAnswers, baseTotal = 0, questions }) {
      const [started, setStarted] = useState(false);
      const [timeLeft, setTimeLeft] = useState(timeLimit);
      const [answers, setAnswers] = useState(() => questions.map(() => ''));
      const [points, setPoints] = useState(() => questions.map(() => ''));

      useEffect(() => {
        if (!started || timeLeft <= 0) return;
        const id = setTimeout(() => setTimeLeft((t) => t - 1), 1000);
        return () => clearTimeout(id);
      }, [started, timeLeft]);

      useEffect(() => {
        if (!started) return;
        const delay = 3000;
        const musicId = setTimeout(() => {
          const music = document.getElementById('feud-fastmoney-music');
          if (music) { music.volume = 0.4; }
          playSound('feud-fastmoney-music');
        }, delay);
        return () => clearTimeout(musicId);
      }, [started]);

      useEffect(() => {
        if (!started || timeLeft > 0) return;
        const music = document.getElementById('feud-fastmoney-music');
        if (music) { music.pause(); music.currentTime = 0; }
        playSound('feud-timer-done');
      }, [started, timeLeft]);

      const handleAnswerChange = (i, value) => {
        setAnswers((prev) => {
          const next = [...prev];
          next[i] = value;
          return next;
        });
      };

      const handlePointsChange = (i, value) => {
        setPoints((prev) => {
          const next = [...prev];
          next[i] = value;
          return next;
        });
      };

      const total = points.reduce((sum, p) => sum + (Number(p) || 0), 0);
      const displayTotal = total + baseTotal;
      const timeUp = started && timeLeft <= 0;

      return (
        <div style={styles.overlay}>
          {!started && <MoneyRain count={20} />}
          <div className="fade-in" style={styles.panelCardCompact}>
            <div style={styles.finalLabelCompact}>Fast Money — {playerLabel}</div>
            {!started && (
              <div style={{ fontSize: '1.1rem', fontWeight: 600, color: 'rgba(116, 45, 73, 0.6)', marginTop: '-1rem', marginBottom: '1.5rem' }}>{teamName}</div>
            )}

            {!started && (
              <button
                className="pill-btn"
                style={styles.revealBtn}
                onClick={() => {
                  setStarted(true);
                  playSound('feud-ding-sound');
                }}
              >
                Start {timeLimit}-Second Timer
              </button>
            )}

            {started && (
              <React.Fragment>
                <div
                  style={{ ...styles.timerRingWrap, ...(timeUp ? styles.timerRingWrapDone : { cursor: 'pointer' }) }}
                  onClick={() => { if (!timeUp) setTimeLeft(0); }}
                >
                  {!timeUp && (
                    <svg viewBox="0 0 130 130" style={styles.timerRingSvg}>
                      <circle cx="65" cy="65" r="52" fill="none" stroke="rgba(116, 45, 73, 0.15)" strokeWidth="10" />
                      <circle
                        cx="65"
                        cy="65"
                        r="52"
                        fill="none"
                        stroke={timeLeft <= 5 ? '#b3261e' : '#c9a227'}
                        strokeWidth="10"
                        strokeLinecap="round"
                        strokeDasharray={TIMER_RING_CIRCUMFERENCE}
                        strokeDashoffset={TIMER_RING_CIRCUMFERENCE * (1 - Math.max(timeLeft, 0) / timeLimit)}
                        style={{
                          transform: 'rotate(-90deg)',
                          transformOrigin: '65px 65px',
                          transition: 'stroke-dashoffset 1s linear, stroke 0.3s ease',
                        }}
                      />
                    </svg>
                  )}
                  <div
                    className={timeLeft <= 5 && !timeUp ? 'timer-ring-pulse' : ''}
                    style={{
                      ...styles.finalTimerCompact,
                      ...styles.timerRingText,
                      ...(timeUp ? { ...styles.finalTimerDone, whiteSpace: 'nowrap', position: 'static' } : {}),
                    }}
                  >
                    {timeUp ? "Time's Up!" : timeLeft}
                  </div>
                </div>

                {!timeUp && (
                  <button
                    className="pill-btn"
                    style={{ ...styles.secondaryBtnSmall, margin: '-0.75rem auto 1.5rem' }}
                    onClick={() => setTimeLeft(0)}
                  >
                    End Timer
                  </button>
                )}

                <div
                  style={{
                    ...styles.fastQGrid,
                    gridTemplateColumns: previousAnswers ? '2.2fr 1fr 1fr' : '3fr 1fr',
                  }}
                >
                  {questions.map((q, i) => (
                    <React.Fragment key={i}>
                      <div style={styles.fastQQuestionCell}>{i + 1}. {q.question}</div>
                      {previousAnswers && (
                        <div style={styles.fastQPrevCell}>
                          {previousAnswers[i].text || '—'}
                          {previousAnswers[i].points ? ` (${previousAnswers[i].points})` : ''}
                        </div>
                      )}
                      <div style={styles.fastQAnswerCell}>
                        <input
                          type="text"
                          placeholder="Answer given"
                          value={answers[i]}
                          onChange={(e) => handleAnswerChange(i, e.target.value)}
                          style={styles.fastAnswerInput}
                        />
                        <input
                          type="number"
                          min={0}
                          placeholder="Pts"
                          value={points[i]}
                          onChange={(e) => handlePointsChange(i, e.target.value)}
                          style={styles.fastPointsInput}
                        />
                      </div>
                    </React.Fragment>
                  ))}
                </div>

                <div style={styles.fastTotalRowCompact}>
                  <span style={styles.fastTotalLabel}>Total</span>
                  <AnimatedNumber value={displayTotal} style={styles.potValueCompact} flashClass="pot-flash" />
                </div>

                <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'center', alignItems: 'center', flexWrap: 'wrap', marginTop: '1rem' }}>
                  <button
                    className="pill-btn"
                    style={{ ...styles.primaryBtnInline, padding: '0.825rem 1.925rem', fontSize: '0.99rem', marginTop: 0, border: '2px solid #742d49' }}
                    onClick={() => onDone(total, answers, points)}
                  >
                    Finish
                  </button>
                  {previousAnswers && (
                    <button
                      className="pill-btn"
                      style={{
                        ...styles.secondaryBtnSmall,
                        padding: '0.76rem 1.5rem',
                        fontSize: '0.99rem',
                        boxSizing: 'border-box',
                        height: 'auto',
                        lineHeight: 'inherit',
                        border: '2px solid #742d49',
                      }}
                      onClick={() => playSound('feud-duplicate')}
                    >
                      🔁 Duplicate
                    </button>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function FastMoneyResult({ combined, onContinue }) {
      const won = combined >= 200;
      return (
        <div style={styles.overlay}>
          {won && <RoundConfetti count={110} />}
          <div className="gameover-bounce" style={styles.panelCard}>
            <div style={styles.finalLabel}>Fast Money Results</div>
            <DoodleUnderline />
            <div style={styles.fastResultBanner}>{won ? '🎉 You Won Fast Money! 🎉' : 'So Close!'}</div>
            <div
              style={{
                ...styles.gameOverWinnerScore,
                fontSize: 'clamp(3.08rem, 7.15vw, 4.84rem)',
                border: '3.3px solid #c9a227',
                padding: '0.55rem 2.42rem',
              }}
            >
              {formatPts(combined)}
            </div>
            <button
              className="pill-btn reveal-btn-pulse"
              style={{
                ...styles.primaryBtnInline,
                padding: '0.825rem 1.925rem',
                fontSize: '0.99rem',
                marginTop: '2.5rem',
              }}
              onClick={onContinue}
            >
              See Final Results
            </button>
          </div>
        </div>
      );
    }

    function FastMoney({ teams, setTeams, fastMoneyQuestions, onFinish }) {
      const [phase, setPhase] = useState('intro'); // intro | p1 | p2 | result
      const [teamIdx, setTeamIdx] = useState(null);
      const [p1Total, setP1Total] = useState(0);
      const [p2Total, setP2Total] = useState(0);
      const [p1Answers, setP1Answers] = useState(null);
      const [awarded, setAwarded] = useState(false);

      const combined = p1Total + p2Total;

      useEffect(() => {
        if (phase !== 'result' || awarded) return;
        setTeams((prev) => {
          const next = [...prev];
          next[teamIdx] = { ...next[teamIdx], score: next[teamIdx].score + combined };
          return next;
        });
        setAwarded(true);
      }, [phase]);

      if (phase === 'intro') {
        return (
          <FastMoneyIntro
            teams={teams}
            onStart={(i) => {
              setTeamIdx(i);
              setPhase('p1');
            }}
          />
        );
      }

      if (phase === 'p1') {
        return (
          <FastMoneyRound
            key="p1"
            playerLabel="Player 1"
            teamName={teams[teamIdx].name}
            timeLimit={30}
            questions={fastMoneyQuestions}
            onDone={(total, answers, points) => {
              setP1Total(total);
              setP1Answers(answers.map((text, i) => ({ text, points: points[i] })));
              setPhase('p2');
            }}
          />
        );
      }

      if (phase === 'p2') {
        return (
          <FastMoneyRound
            key="p2"
            playerLabel="Player 2"
            teamName={teams[teamIdx].name}
            timeLimit={35}
            questions={fastMoneyQuestions}
            previousAnswers={p1Answers}
            baseTotal={p1Total}
            onDone={(total) => {
              setP2Total(total);
              setPhase('result');
            }}
          />
        );
      }

      return (
        <FastMoneyResult
          combined={combined}
          onContinue={onFinish}
        />
      );
    }

    function Game({ teams, setTeams, questionSet }) {
      const ROUNDS = QUESTION_SETS[questionSet].rounds;
      const FAST_MONEY = QUESTION_SETS[questionSet].fastMoney;
      const [roundIdx, setRoundIdx] = useState(0);
      const [stage, setStage] = useState('rounds'); // 'rounds' | 'gameover'
      const roundsDone = roundIdx >= ROUNDS.length;

      const awardPot = (teamIdx, pot) => {
        setTeams((prev) => {
          const next = [...prev];
          next[teamIdx] = {
            ...next[teamIdx],
            score: next[teamIdx].score + pot,
            roundScore: next[teamIdx].roundScore + pot,
          };
          return next;
        });
      };

      if (stage === 'gameover') {
        return <GameOverScreen teams={teams} />;
      }

      if (roundsDone) {
        return <FastMoney teams={teams} setTeams={setTeams} fastMoneyQuestions={FAST_MONEY} onFinish={() => setStage('gameover')} />;
      }

      return (
        <FeudBoard
          key={roundIdx}
          round={ROUNDS[roundIdx]}
          roundNumber={roundIdx + 1}
          totalRounds={ROUNDS.length}
          teams={teams}
          onAwardPot={awardPot}
          onNextRound={() => setRoundIdx((r) => r + 1)}
          isLastRound={roundIdx === ROUNDS.length - 1}
        />
      );
    }

    function App() {
      const [phase, setPhase] = useState('setup');
      const [teams, setTeams] = useState([]);
      const [questionSet, setQuestionSet] = useState(Object.keys(QUESTION_SETS)[0]);

      const startGame = (initialTeams) => {
        setTeams(initialTeams);
        setPhase('playing');
      };

      const FAST_MONEY = QUESTION_SETS[questionSet].fastMoney;

      return (
        <React.Fragment>
          {phase === 'setup' && <Setup onStart={startGame} />}
          {phase === 'playing' && <Game teams={teams} setTeams={setTeams} questionSet={questionSet} />}
          {phase === 'fastmoney' && (
            <FastMoney teams={teams} setTeams={setTeams} fastMoneyQuestions={FAST_MONEY} onFinish={() => setPhase('gameover')} />
          )}
          {phase === 'gameover' && <GameOverScreen teams={teams} />}
          {phase === 'setup' && (
            <div style={{ position: 'fixed', bottom: '1rem', right: '1rem', zIndex: 50, display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
